# Blueprint de Render para Biblioteca Zorzal (Laravel 13 + Livewire).
# Con este archivo: Dashboard -> New -> Blueprint -> seleccionas el repo.
#
# CONFIGURACION GRATIS:
# - Web Service free (se duerme a los 15 min sin visitas).
# - PostgreSQL free (expira 30 dias despues de crearlo).
# - Sin disco persistente: los PDFs subidos se pierden en cada deploy/restart.
#
# Para pasar a produccion despues:
#   1. cambia `plan: free` del web service por `plan: starter`
#   2. agrega el bloque `disk:` al final (ver comentario)
#   3. cambia el plan de la base a basic-256mb

databases:
  - name: biblioteca-db
    databaseName: biblioteca
    user: biblioteca
    plan: free
    region: virginia

services:
  - type: web
    name: biblioteca
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    autoDeploy: true
    envVars:
      - key: APP_NAME
        value: Biblioteca Zorzal
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false # lo pegas en el dashboard (php artisan key:generate --show)
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: warning
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: biblioteca-db
          property: connectionString
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: FILESYSTEM_DISK
        value: local
      - key: MAIL_MAILER
        value: log
    # Disco persistente: solo disponible en planes pagos.
    # disk:
    #   name: biblioteca-storage
    #   mountPath: /var/www/html/storage/app
    #   sizeGB: 1
